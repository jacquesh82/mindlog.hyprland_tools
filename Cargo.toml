[workspace]
resolver = "2"
members = ["crates/hyprpanel-core", "crates/hyprpanel-server", "crates/hyprpanel-chat"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "0.9"
