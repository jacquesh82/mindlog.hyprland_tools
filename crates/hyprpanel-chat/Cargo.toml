[package]
name = "hyprpanel-chat"
description = "Fenêtre Slint cliente chatbot du panneau de configuration Hyprland"
version.workspace = true
edition.workspace = true
# Slint est lié sous licence communautaire GPL-3.0 → ce crate suit.
license = "GPL-3.0-only"

[[bin]]
name = "hyprpanel-chat"
path = "src/main.rs"

[dependencies]
hyprpanel-core = { path = "../hyprpanel-core" }
rmcp = { version = "3", default-features = false, features = ["client", "transport-streamable-http-client-reqwest"] }
slint = "1.18"
# TLS rustls pour l'API LLM (le reqwest de rmcp est sans TLS, réservé au MCP local)
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "io-util"] }
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
anyhow = "1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }

[build-dependencies]
slint-build = "1.18"
