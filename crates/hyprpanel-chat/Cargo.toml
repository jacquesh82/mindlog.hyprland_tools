[package]
name = "hyprpanel-chat"
description = "Fenêtre Slint cliente chatbot du panneau de configuration Hyprland"
version.workspace = true
edition.workspace = true
# Slint est lié sous licence communautaire GPL-3.0 → ce crate suit.
license = "GPL-3.0-only"

[[bin]]
name = "hyprpanel-chat"
path = "src/main.rs"

[dependencies]
hyprpanel-core = { path = "../hyprpanel-core" }
rmcp = { version = "3", default-features = false, features = ["client", "transport-streamable-http-client-reqwest"] }
slint = "1.18"
# Le transport LLM reste distinct du client HTTPS des outils de recherche.
reqwest = "0.11"
libc = "0.2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "io-util", "process", "net"] }
tempfile = "3"
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
anyhow = "1"
base64 = "0.22"
sha2 = "0.11"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
langchain-rust = "8.0.0"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
html5ever = "0.26"
markup5ever_rcdom = "0.2"

[build-dependencies]
slint-build = "1.18"
image = { version = "0.25", default-features = false, features = ["png"] }

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
