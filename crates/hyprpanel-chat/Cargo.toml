[package]
name = "hyprpanel-chat"
description = "Fenêtre Slint cliente chatbot du panneau de configuration Hyprland"
version.workspace = true
edition.workspace = true
# Slint est lié sous licence communautaire GPL-3.0 → ce crate suit.
license = "GPL-3.0-only"

[[bin]]
name = "hyprpanel-chat"
path = "src/main.rs"

[dependencies]
hyprpanel-core = { path = "../hyprpanel-core" }
rmcp = { version = "3", default-features = false, features = ["client", "transport-streamable-http-client-reqwest"] }
slint = "1.18"
# Le transport LLM (HTTPS, SSE) est porté par langchain-rust ; le reqwest de
# rmcp reste sans TLS, réservé au MCP local.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "io-util"] }
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
anyhow = "1"
base64 = "0.22"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
langchain-rust = "8.0.0"

[build-dependencies]
slint-build = "1.18"

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
